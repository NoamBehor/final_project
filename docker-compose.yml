services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: radio_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

  postgres:
    image: postgres:15
    container_name: radio_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: radio_nlp_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
